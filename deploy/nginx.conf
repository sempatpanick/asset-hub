worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 # Native error logs can contain signed query strings. API logs are sanitized.
 error_log /dev/null;
 sendfile on;
 server_tokens off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 9m;
 keepalive_timeout 60;
 server {
  listen 3005;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-cache always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location /v1/ {
   proxy_pass http://api:8085;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_request_buffering off;
   proxy_buffering off;
   proxy_read_timeout 150s;
   add_header Cache-Control no-store always;
   add_header X-Content-Type-Options nosniff always;
   add_header X-Frame-Options DENY always;
  }
  # The API enforces saved per-request upload deadlines. This ceiling allows
  # the maximum response setting (1830s) plus a margin without a proxy reload.
  location ~ ^/v1/(uploads(/|$)|assets$) {
   proxy_pass http://api:8085;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_request_buffering off;
   proxy_buffering off;
   client_body_timeout 1860s;
   proxy_send_timeout 1860s;
   proxy_read_timeout 1860s;
   add_header Cache-Control no-store always;
   add_header X-Content-Type-Options nosniff always;
   add_header X-Frame-Options DENY always;
  }
  location = /healthz { proxy_pass http://api:8085/healthz; access_log off; }
  location = /readyz { proxy_pass http://api:8085/readyz; access_log off; }
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; }
 }
}
