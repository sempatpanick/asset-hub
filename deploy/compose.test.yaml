name: assethub-test
services:
  postgres:
    image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_USER: assethub
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Generate temporary test password}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U assethub"]
      interval: 2s
      retries: 20
    mem_limit: 512m
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
    mem_limit: 128m
