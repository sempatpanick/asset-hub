name: assethub-test
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: assethub
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Generate temporary test password}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U assethub"]
      interval: 2s
      retries: 20
    mem_limit: 512m
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
    mem_limit: 128m
