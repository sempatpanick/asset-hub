name: assethub
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS public origin}
  LISTEN_ADDR: :8085
  DATABASE_URL: postgres://assethub_api:${APP_DATABASE_PASSWORD:?Generate a runtime database password}@postgres:5432/assethub?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:?Generate a Redis password}@redis:6379/0
  BACKUP_ROOT: /backup
  BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
  STAGING_ROOT: /data/staging
  LOCAL_ROOT: /data/local
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-telegram}
  STAGING_LIMIT_BYTES: ${STAGING_LIMIT_BYTES:-21474836480}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
  TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
  ASSET_MASTER_KEY: ${ASSET_MASTER_KEY:-}
  GOMEMLIMIT: 384MiB
  SIGNED_URL_KEY: ${SIGNED_URL_KEY:-}
  DISK_RESERVE_PERCENT: ${DISK_RESERVE_PERCENT:-10}
  CACHE_ROOT: /data/cache
  CACHE_LIMIT_BYTES: ${CACHE_LIMIT_BYTES:-10737418240}
services:
  storage-init:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for directory in staging cache local; do
          test ! -L "/data/$$directory"
          mkdir -p "/data/$$directory"
          chown 65532:65532 "/data/$$directory"
          chmod 0700 "/data/$$directory"
        done
    volumes: ["${DATA_ROOT:-/srv/assethub}:/data"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: assethub
      POSTGRES_DB: assethub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a PostgreSQL password}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5435}:5432"]
    volumes:
      - ${DATA_ROOT:-/srv/assethub}/postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U assethub -d assethub"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
        --requirepass,
        "${REDIS_PASSWORD:?Generate a Redis password}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate a Redis password}
    ports: ["127.0.0.1:${REDIS_PORT:-6385}:6379"]
    volumes:
      - ${DATA_ROOT:-/srv/assethub}/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: assethub-backend:0.3.0
    command: [/app/admin, migrate]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://assethub:${POSTGRES_PASSWORD:?Generate a PostgreSQL owner password}@postgres:5432/assethub?sslmode=disable
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Generate a runtime database password}
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    mem_limit: 256m
    volumes:
      - ${DATA_ROOT:-/srv/assethub}/staging:/data/staging
  api:
    image: assethub-backend:0.3.0
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8085}:8085"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-/srv/assethub}/staging:/data/staging
      - ${DATA_ROOT:-/srv/assethub}/cache:/data/cache
      - ${DATA_ROOT:-/srv/assethub}/local:/data/local
      - type: bind
        source: ${BACKUP_PATH:-/mnt/assethub-backup}
        target: /backup
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/api, healthcheck]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
  worker:
    image: assethub-backend:0.3.0
    command: [/app/worker]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-/srv/assethub}/staging:/data/staging
      - ${DATA_ROOT:-/srv/assethub}/local:/data/local
      - type: bind
        source: ${BACKUP_PATH:-/mnt/assethub-backup}
        target: /backup
        bind: { create_host_path: false }
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/worker, healthcheck]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: assethub-web:0.3.0
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3005}:3005"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=32m, /var/cache/nginx:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3005/healthz]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
