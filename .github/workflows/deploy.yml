name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-flight migration or deployment.
concurrency:
  group: assethub-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, web]
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve immutable source image
        id: image
        run: |
          set -euo pipefail
          task_tag=$(bash deploy/image-tags.sh "$SERVICE")
          task_image="${IMAGE_REPO,,}/$SERVICE:$task_tag"
          echo "tag=$task_image" >> "$GITHUB_OUTPUT"
          if task_inspection=$(docker buildx imagetools inspect "$task_image" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$task_inspection" | grep -Eqi 'not found|manifest unknown|404|denied|unauthorized'; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$task_inspection" >&2
            exit 1
          fi
      - name: Build and publish native ARM64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=min,ignore-error=true,scope=${{ matrix.service }}
      - name: Record registry digest
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          task_digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$task_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          task_repository="${IMAGE%:*}"
          printf '%s_IMAGE=%s@%s\n' "${SERVICE^^}" "$task_repository" "$task_digest" > "$SERVICE.env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.env
          retention-days: 7

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || '/srv/projects/asset-hub' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment secrets
        run: |
          set -euo pipefail
          for task_secret in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!task_secret}" ]]; then
              echo "Missing GitHub Actions secret: $task_secret" >&2
              exit 1
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: .local/images
          merge-multiple: true
      - name: Assemble verified release manifest
        run: cat .local/images/backend.env .local/images/web.env > deploy/images.env
      - name: Install verified Cloudflare SSH transport
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assethub-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 \
            -o "$RUNNER_TEMP/assethub-bin/cloudflared"
          printf '%s  %s\n' 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db' \
            "$RUNNER_TEMP/assethub-bin/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/assethub-bin/cloudflared"
          echo "$RUNNER_TEMP/assethub-bin" >> "$GITHUB_PATH"
      - name: Deploy verified images to the Orange Pi
        run: bash scripts/ci/deploy-ssh.sh
